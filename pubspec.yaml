name: elides_family
description: "Elide's Family — educational minigames for children aged 3 and up."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Minigame engine (D-008)
  flame: ^1.28.0
  flame_audio: ^2.11.0
  # Local progress storage (offline)
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: false
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/audio/voice/it/
    - assets/audio/voice/en/

  # Fredoka font (D-017): enable after copying the file into assets/fonts/
  # (see ROADMAP, Phase 2).
  # fonts:
  #   - family: Fredoka
  #     fonts:
  #       - asset: assets/fonts/Fredoka-VariableFont_wdth,wght.ttf
